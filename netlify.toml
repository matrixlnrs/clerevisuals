# Netlify deploy config — https://clerevisuals.fr

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No SPA catch-all redirect on purpose: the site is a single page with anchor
# navigation and no client-side router, so an unknown path should 404 rather
# than silently render the homepage.

# ── Security headers ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # style-src needs 'unsafe-inline': React writes inline style attributes
    # throughout the components. script-src does not, which is the one that
    # matters — keep it that way by not introducing inline event handlers.
    Content-Security-Policy = """default-src 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'; \
      form-action 'self'; \
      img-src 'self' data:; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      connect-src 'self' https://api.web3forms.com"""

# ── Caching ──────────────────────────────────────────────────────────────
# Vite fingerprints everything in /assets/, so those can never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photo filenames are stable (01.webp stays 01.webp), so replacing a photo
# reuses its URL. Long cache, but NOT immutable — a swapped photo should reach
# visitors within the month rather than never.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
