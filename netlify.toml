# Netlify deploy config — https://clerevisuals.fr

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No SPA catch-all redirect on purpose: the site is a single page with anchor
# navigation and no client-side router, so an unknown path should 404 rather
# than silently render the homepage.

# ── Headers and caching ──────────────────────────────────────────────────
# Deliberately NOT here: they live in public/_headers, which ships inside the
# published folder. That way a drag-and-drop deploy of dist/ keeps the CSP and
# the cache policy — this file would be left behind in that case, and the site
# would go out silently unprotected.
