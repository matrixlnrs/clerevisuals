<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── SEO ─────────────────────────────────────────────────────────
         The page is one URL: the FR/EN switch is client-side, so there is
         a single canonical and no hreflang alternates to declare.        -->
    <title>Clerevisuals — Sports Photography in Provence</title>
    <meta name="description"
      content="Sports and event photography in Provence by Mathis Lenorais — track &amp; field, motorsport at Circuit Paul Ricard, cycling, festivals and landscapes. Based in Aix-en-Provence, available across France." />
    <meta name="author" content="Mathis Lenorais" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://clerevisuals.fr/" />
    <meta name="theme-color" content="#0D0D0D" />

    <!-- ── Social sharing — absolute URLs, scrapers don't resolve relative ones -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://clerevisuals.fr/" />
    <meta property="og:site_name"   content="Clerevisuals" />
    <meta property="og:title"       content="Clerevisuals — Sports Photography in Provence" />
    <meta property="og:description" content="Track &amp; field, motorsport, cycling and event photography in Provence by Mathis Lenorais." />
    <meta property="og:image"       content="https://clerevisuals.fr/images/og-cover.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="A cycling peloton on the banked track at Circuit Paul Ricard" />
    <meta property="og:locale"      content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Clerevisuals — Sports Photography in Provence" />
    <meta name="twitter:description" content="Track &amp; field, motorsport, cycling and event photography in Provence." />
    <meta name="twitter:image"       content="https://clerevisuals.fr/images/og-cover.jpg" />

    <!-- ── Fonts ───────────────────────────────────────────────────────
         Self-hosted, declared in src/fonts.css and bundled into the site's
         own stylesheet — no third-party request, nothing blocking on another
         origin. The two faces the first screen actually needs are preloaded
         so they are in flight before the CSS has even been parsed; the rest
         are fetched on demand. `crossorigin` is required on font preloads
         even same-origin, or the browser fetches the file twice. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/cormorant-garamond-300-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/inter-300-latin.woff2" />

    <!-- ── Who this business is, for search engines ─────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://clerevisuals.fr/#business",
        "name": "Clerevisuals",
        "url": "https://clerevisuals.fr/",
        "image": "https://clerevisuals.fr/images/og-cover.jpg",
        "description": "Sports and event photography in Provence — track & field, motorsport, cycling, festivals and landscapes.",
        "founder": { "@type": "Person", "name": "Mathis Lenorais" },
        "areaServed": [
          { "@type": "Place", "name": "Provence-Alpes-Côte d'Azur" },
          { "@type": "Country", "name": "France" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Aix-en-Provence",
          "addressRegion": "Provence-Alpes-Côte d'Azur",
          "addressCountry": "FR"
        },
        "knowsLanguage": ["fr", "en"],
        "sameAs": [
          "https://www.instagram.com/clerevisuals/",
          "https://www.flickr.com/photos/clerephotography/albums/",
          "https://www.linkedin.com/in/mathis-lenorais-clere-06a149272/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
